x-defaults: &defaults
  restart: no
  networks:
    - nuxt-boilerplate
  env_file:
    - ./.env.common
    - ./.env
  platform: linux/amd64

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  # The primary PostgreSQL database for the application.
  postgres:
    <<: *defaults
    image: postgres:18-alpine
    container_name: egp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-database}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql
      - ./.docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: [ 'CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB' ]

  # A web-based database management interface (accessible on port 8080).
  adminer:
    <<: *defaults
    image: shyim/adminerevo
    container_name: egp-adminer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_DRIVER: pgsql
      ADMINER_DEFAULT_SERVER: postgres:5432
      ADMINER_DEFAULT_DB: ${POSTGRES_DB:-database}
      ADMINER_DEFAULT_USER: ${POSTGRES_USER:-postgres}
      ADMINER_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd}
    ports:
      - 127.0.0.1:${ADMINER_PORT:-8080}:8080

  # The main application running in development mode with HMR and volume mounting.
  app-dev:
    <<: *defaults
    build:
      context: .
      target: development
    image: egp-broker-dev:${APP_VERSION:-latest}
    container_name: egp-broker-dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      postgres:
        condition: service_healthy
      adminer:
        condition: service_started

  # Playwright server for secure, sandboxed E2E testing.
  playwright:
    image: mcr.microsoft.com/playwright:v1.56.1-jammy
    container_name: egp-playwright
    user: pwuser
    working_dir: /home/pwuser
    command: npx playwright run-server --port 3001
    ports:
      - 127.0.0.1:3001:3001
    networks:
      - nuxt-boilerplate
    restart: unless-stopped
    depends_on:
      app-dev:
        condition: service_started

  # Used to build the production-ready Docker image. Not intended for active development.
  # Run with `docker compose --profile production up app-prod`
  app-prod:
    <<: *defaults
    profiles: [ 'production' ]
    build:
      context: .
      target: production
    image: egp-broker:${APP_VERSION:-latest}
    container_name: egp-broker
    ports:
      - 127.0.0.1:8081:3000 # Changed from 8080 to avoid conflict with Adminer
    depends_on:
      postgres:
        condition: service_healthy

networks:
  nuxt-boilerplate:
    driver: bridge
    name: nuxt-boilerplate_network

# No named volumes; using bind mounts for persistence
