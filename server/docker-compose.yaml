services:
  lti-server:
    image: lti-server
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: lti-server
    ports:
      - 3000:3000
    networks:
      - my-shared-network
  mongo-lti:
    image: mongo
    restart: always
    container_name: mongo-lti
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - 27017:27017
    networks:
      - my-shared-network

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: rootpassword
      ME_CONFIG_MONGODB_URL: mongodb://root:rootpassword@mongo-lti:27017/
      ME_CONFIG_BASICAUTH: false
    networks:
      - my-shared-network
    
networks:
  my-shared-network:
    driver: bridge