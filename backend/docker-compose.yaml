services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: dev
    container_name: backend
    ports:
      - "3001:3000"
    volumes:
      - .:/app/backend
    environment:
      - NODE_ENV=development
      - DB_HOST=mongo
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=freepassdb
      - MONGO_URL=mongodb://root:rootpassword@mongo:27017/freepassdb?authSource=admin
      - JWT_SECRET=your_jwt_secret
      - DEV_MODE=true
      - PORT=3000
      - CANVAS_URL=http://web:3000
      - PLATFORM_NAME=Canvas LMS
      - CLIENT_ID=10000000000001
      - CLIENT_SECRET=xxx
      - AUTH_ENDPOINT=http://host.docker.internal:3000/api/lti/authorize_redirect
      - TOKEN_ENDPOINT=http://host.docker.internal:3000/login/oauth2/token
      - JWK_KEY=http://host.docker.internal:3000/api/lti/security/jwks
      - SEED_KEY=12345789
    depends_on:
      - mongo
    restart: always
    networks:
      - my-shared-network
    
  mongo:
    image: mongo
    restart: always
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - ../mongo/db:/data/db
    networks:
      - my-shared-network

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: rootpassword
      ME_CONFIG_MONGODB_URL: mongodb://root:rootpassword@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    networks:
      - my-shared-network
    
networks:
  my-shared-network:
    driver: bridge